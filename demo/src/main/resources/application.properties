spring.application.name=demo

# Server Configuration
server.port=8080
server.servlet.context-path=/

# DataSource Configuration
spring.datasource.url=jdbc:mariadb://192.168.253.128:3306/qantum
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false
spring.jpa.open-in-view=false

# Performance Optimization
spring.lazy-initialization=true
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# DataSource Connection Pool Optimization
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# Logging Configuration
logging.level.root=WARN
logging.level.com.webtesting.demo=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.boot.autoconfigure=WARN

# Jackson Configuration
# spring.jackson.serialization.write-dates-as-timestamps=false (deprecated in latest Jackson)
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null
