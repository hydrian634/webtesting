<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - QanTum</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Open+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          "Roboto",
          "Open Sans",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background-color: #f5f5f5;
        color: #333;
      }

      .navbar {
        background: #1a1a1a;
        padding: 0 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        height: 98px;
      }

      .navbar-brand {
        font-size: 36px;
        font-weight: 700;
        color: white;
        text-decoration: none;
      }

      .nav-items {
        display: flex;
        gap: 30px;
      }

      .nav-items a {
        color: white;
        text-decoration: none;
        font-size: 16px;
        font-weight: 500;
      }

      .menu-bar {
        background: #2a2a2a;
        padding: 0 40px;
        display: flex;
        gap: 80px;
        height: 98px;
        align-items: center;
      }

      .menu-bar a {
        color: white;
        text-decoration: none;
        font-size: 18px;
        font-weight: 500;
      }

      .container {
        max-width: 1920px;
        margin: 0 auto;
        padding: 40px;
      }

      .content-wrapper {
        display: flex;
        gap: 40px;
      }

      .sidebar {
        width: 400px;
        background: white;
        padding: 30px;
        border-radius: 8px;
        height: fit-content;
      }

      .sidebar-title {
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 30px;
        padding: 15px;
        background: #667eea;
        color: white;
        border-radius: 6px;
      }

      .sidebar-menu {
        list-style: none;
      }

      .sidebar-menu li {
        margin-bottom: 0;
      }

      .sidebar-menu a {
        display: block;
        padding: 15px;
        color: #333;
        text-decoration: none;
        border-bottom: 1px solid #eee;
        font-size: 16px;
        font-weight: 500;
        transition: all 0.3s;
      }

      .sidebar-menu a:hover {
        background: #f5f5f5;
        color: #667eea;
        padding-left: 20px;
      }

      .main-content {
        flex: 1;
        background: white;
        padding: 40px;
        border-radius: 8px;
      }

      .page-title {
        font-size: 42px;
        font-weight: 700;
        margin-bottom: 40px;
        color: #333;
      }

      .info-card {
        background: #f9f9f9;
        padding: 30px;
        border-radius: 8px;
        margin-bottom: 30px;
        border-left: 4px solid #667eea;
      }

      .info-label {
        font-size: 12px;
        color: #999;
        text-transform: uppercase;
        margin-bottom: 8px;
      }

      .info-value {
        font-size: 18px;
        font-weight: 600;
        color: #333;
      }

      .footer {
        background: #1a1a1a;
        color: white;
        padding: 40px;
        text-align: center;
        margin-top: 60px;
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <a href="/" class="navbar-brand">QanTum</a>
      <div class="nav-items">
        <a href="/signin">Sign in/up</a>
        <a href="/dashboard">My Account</a>
      </div>
    </nav>

    <div class="menu-bar">
      <a href="/products">Products</a>
      <a href="/software">Software</a>
      <a href="/support">Support</a>
    </div>

    <div class="container">
      <div class="content-wrapper">
        <aside class="sidebar">
          <div class="sidebar-title">My Account</div>
          <ul class="sidebar-menu">
            <li><a href="/dashboard/account">Account Information</a></li>
            <li><a href="/dashboard/addresses">Address book</a></li>
            <li><a href="/dashboard/orders">My Orders</a></li>
          </ul>
        </aside>

        <main class="main-content">
          <h1 class="page-title">My Orders</h1>

          <div class="info-card">
            <div class="info-label">Total Orders</div>
            <div class="info-value">0</div>
          </div>

          <div class="info-card">
            <div class="info-label">Last Order Date</div>
            <div class="info-value">No orders yet</div>
          </div>

          <div class="info-card">
            <div class="info-label">Total Spent</div>
            <div class="info-value">₩ 0</div>
          </div>
        </main>
      </div>
    </div>

    <footer class="footer">
      <p>
        © 2026 skyaliqo0206. All rights reserved. Logo created by ChatGPT AI.
      </p>
    </footer>
  </body>
</html>
