<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products - QanTum</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Open+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          "Roboto",
          "Open Sans",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background-color: #f5f5f5;
        color: #333;
      }

      .navbar {
        background: #1a1a1a;
        padding: 0 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        height: 98px;
      }

      .navbar-brand {
        font-size: 36px;
        font-weight: 700;
        color: white;
        text-decoration: none;
      }

      .nav-items {
        display: flex;
        gap: 30px;
      }

      .nav-items a {
        color: white;
        text-decoration: none;
        font-size: 16px;
        font-weight: 500;
      }

      .menu-bar {
        background: #2a2a2a;
        padding: 0 40px;
        display: flex;
        gap: 80px;
        height: 98px;
        align-items: center;
      }

      .menu-bar a {
        color: white;
        text-decoration: none;
        font-size: 18px;
        font-weight: 500;
      }

      .container {
        max-width: 1920px;
        margin: 0 auto;
        padding: 40px;
      }

      .page-title {
        font-size: 64px;
        font-weight: 700;
        margin-bottom: 40px;
        color: #333;
      }

      .content-wrapper {
        display: flex;
        gap: 40px;
      }

      .sidebar {
        width: 350px;
        background: white;
        padding: 30px;
        border-radius: 8px;
        height: fit-content;
      }

      .main-content {
        flex: 1;
      }

      .filter-section {
        margin-bottom: 40px;
      }

      .filter-title {
        font-size: 18px;
        font-weight: 700;
        margin-bottom: 20px;
        padding-bottom: 15px;
        border-bottom: 1px solid #eee;
      }

      .search-box {
        width: 100%;
        padding: 12px 16px;
        border: 1px solid #ddd;
        border-radius: 8px;
        margin-bottom: 30px;
        font-size: 14px;
      }

      .filter-option {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .filter-option a {
        color: #667eea;
        text-decoration: none;
        font-size: 14px;
        padding: 8px 0;
      }

      .filter-option a:hover {
        text-decoration: underline;
      }

      .products-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 30px;
        margin-bottom: 40px;
      }

      .product-card {
        background: white;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        transition: all 0.3s;
        cursor: pointer;
      }

      .product-card:hover {
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
        transform: translateY(-4px);
      }

      .product-image {
        width: 100%;
        height: 200px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: 700;
      }

      .product-info {
        padding: 20px;
      }

      .product-name {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 8px;
        color: #333;
      }

      .product-price {
        font-size: 18px;
        font-weight: 700;
        color: #667eea;
      }

      .pagination {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-top: 40px;
      }

      .pagination a,
      .pagination span {
        padding: 8px 12px;
        border: 1px solid #ddd;
        border-radius: 4px;
        text-decoration: none;
        color: #667eea;
        cursor: pointer;
      }

      .pagination .active {
        background: #667eea;
        color: white;
      }

      .footer {
        background: #1a1a1a;
        color: white;
        padding: 40px;
        text-align: center;
        margin-top: 60px;
      }

      .footer-icons {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 20px;
      }

      .footer-icon {
        width: 81px;
        height: 81px;
        background: #333;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <a href="/" class="navbar-brand">QanTum</a>
      <div class="nav-items">
        <a href="/signin">Sign in/up</a>
        <a href="/">My Account</a>
      </div>
    </nav>

    <div class="menu-bar">
      <a href="/products">Products</a>
      <a href="/software">Software</a>
      <a href="/support">Support</a>
    </div>

    <div class="container">
      <h1 class="page-title">Products</h1>

      <div class="content-wrapper">
        <aside class="sidebar">
          <div class="filter-section">
            <div class="filter-title">검색</div>
            <form th:action="@{/products}" method="GET">
              <input
                type="text"
                name="search"
                class="search-box"
                placeholder="Search products..."
                th:value="${search}"
              />
              <button
                type="submit"
                style="
                  padding: 10px 20px;
                  background: #667eea;
                  color: white;
                  border: none;
                  border-radius: 6px;
                  cursor: pointer;
                  width: 100%;
                "
              >
                검색
              </button>
            </form>
          </div>

          <div class="filter-section">
            <div class="filter-title">Categories</div>
            <div class="filter-option">
              <a th:href="@{/products}">All</a>
              <a th:href="@{/products(category='Gaming Gear')}">Gaming Gear</a>
              <a th:href="@{/products(category='Enterprise')}">Enterprise</a>
              <a th:href="@{/products(category='Popular Topics')}"
                >Popular Topics</a
              >
            </div>
          </div>
        </aside>

        <main class="main-content">
          <div class="products-grid">
            <div
              th:each="product : ${products.content}"
              class="product-card"
              th:onclick="@{'/products/' + ${product.id}}"
            >
              <div class="product-image" th:text="${product.name}"></div>
              <div class="product-info">
                <div class="product-name" th:text="${product.name}"></div>
                <div
                  class="product-price"
                  th:text="'₩ ' + ${#numbers.formatInteger(product.price, 0)}"
                ></div>
              </div>
            </div>
          </div>

          <div class="pagination">
            <a
              th:if="${currentPage > 0}"
              th:href="@{/products(page=${currentPage - 1})}"
              >← Previous</a
            >
            <span
              th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
              th:classappend="${i == currentPage} ? 'active'"
            >
              <a th:href="@{/products(page=${i})}" th:text="${i + 1}"></a>
            </span>
            <a
              th:if="${currentPage < totalPages - 1}"
              th:href="@{/products(page=${currentPage + 1})}"
              >Next →</a
            >
          </div>
        </main>
      </div>
    </div>

    <footer class="footer">
      <p>
        © 2026 skyaliqo0206. All rights reserved. Logo created by ChatGPT AI.
      </p>
      <div class="footer-icons">
        <div class="footer-icon">AI</div>
        <div class="footer-icon">ChatGPT</div>
        <div class="footer-icon">Generated</div>
        <div class="footer-icon">2026</div>
      </div>
    </footer>
  </body>
</html>
