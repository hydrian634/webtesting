<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - QanTum</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Open+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          "Roboto",
          "Open Sans",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .container {
        width: 100%;
        max-width: 600px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        padding: 60px;
      }

      .logo {
        font-size: 48px;
        font-weight: 700;
        color: #667eea;
        margin-bottom: 40px;
        text-align: center;
      }

      h2 {
        font-size: 32px;
        color: #333;
        margin-bottom: 30px;
        text-align: center;
      }

      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
        color: #333;
        font-size: 14px;
      }

      input[type="text"],
      input[type="email"],
      input[type="password"] {
        width: 100%;
        padding: 12px 16px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 14px;
        transition: border-color 0.3s;
      }

      input[type="text"]:focus,
      input[type="email"]:focus,
      input[type="password"]:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }

      .error {
        color: #dc3545;
        font-size: 13px;
        margin-top: 5px;
      }

      .signup-btn {
        width: 100%;
        padding: 12px;
        background: #667eea;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.3s;
        margin-top: 20px;
      }

      .signup-btn:hover {
        background: #5568d3;
      }

      .login-link {
        text-align: center;
        margin-top: 20px;
        font-size: 14px;
        color: #666;
      }

      .login-link a {
        color: #667eea;
        text-decoration: none;
        font-weight: 600;
      }

      .alert {
        padding: 12px 16px;
        border-radius: 8px;
        margin-bottom: 30px;
        font-size: 14px;
      }

      .alert-danger {
        background-color: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo">QanTum</div>
      <h2>회원 가입</h2>

      <form th:action="@{/signup}" method="POST" th:object="${signUpRequest}">
        <div
          th:if="${#fields.hasErrors('global')}"
          class="alert alert-danger error"
        >
          <div
            th:each="err : ${#fields.errors('global')}"
            th:text="${err}"
          ></div>
        </div>

        <div class="form-group">
          <label for="username">이름</label>
          <input
            type="text"
            id="username"
            th:field="*{fullName}"
            placeholder="Full Name"
            required
          />
          <div
            th:if="${#fields.hasErrors('fullName')}"
            class="error"
            th:errors="*{fullName}"
          ></div>
        </div>

        <div class="form-group">
          <label for="email">이메일 주소</label>
          <input
            type="email"
            id="email"
            th:field="*{email}"
            placeholder="your@email.com"
            required
          />
          <div
            th:if="${#fields.hasErrors('email')}"
            class="error"
            th:errors="*{email}"
          ></div>
        </div>

        <div class="form-group">
          <label for="username2">Username</label>
          <input
            type="text"
            id="username2"
            th:field="*{username}"
            placeholder="Choose username"
            required
          />
          <div
            th:if="${#fields.hasErrors('username')}"
            class="error"
            th:errors="*{username}"
          ></div>
        </div>

        <div class="form-group">
          <label for="password">비밀번호</label>
          <input
            type="password"
            id="password"
            th:field="*{password}"
            placeholder="Enter password"
            required
          />
          <div
            th:if="${#fields.hasErrors('password')}"
            class="error"
            th:errors="*{password}"
          ></div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">비밀번호 확인</label>
          <input
            type="password"
            id="confirmPassword"
            th:field="*{confirmPassword}"
            placeholder="Confirm password"
            required
          />
          <div
            th:if="${#fields.hasErrors('confirmPassword')}"
            class="error"
            th:errors="*{confirmPassword}"
          ></div>
        </div>

        <button type="submit" class="signup-btn">회원 가입</button>
      </form>

      <div class="login-link">
        이미 계정이 있으신가요? <a href="/signin">로그인</a>
      </div>
    </div>
  </body>
</html>
