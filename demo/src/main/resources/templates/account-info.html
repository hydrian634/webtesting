<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account Information - QanTum</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #f5f5f5;
        color: #333;
      }

      .navbar {
        background: #1a1a1a;
        padding: 0 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        height: 98px;
      }

      .navbar-brand {
        font-size: 36px;
        font-weight: 700;
        color: white;
        text-decoration: none;
      }

      .nav-items {
        display: flex;
        gap: 30px;
      }

      .nav-items a {
        color: white;
        text-decoration: none;
        font-size: 16px;
        font-weight: 500;
      }

      .menu-bar {
        background: #2a2a2a;
        padding: 0 40px;
        display: flex;
        gap: 80px;
        height: 98px;
        align-items: center;
      }

      .menu-bar a {
        color: white;
        text-decoration: none;
        font-size: 18px;
        font-weight: 500;
      }

      .container {
        max-width: 1920px;
        margin: 0 auto;
        padding: 40px;
      }

      .content-wrapper {
        display: flex;
        gap: 40px;
      }

      .sidebar {
        width: 400px;
        background: white;
        padding: 30px;
        border-radius: 8px;
        height: fit-content;
      }

      .sidebar-title {
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 30px;
        padding: 15px;
        background: #667eea;
        color: white;
        border-radius: 6px;
      }

      .sidebar-menu {
        list-style: none;
      }

      .sidebar-menu li {
        margin-bottom: 0;
      }

      .sidebar-menu a {
        display: block;
        padding: 15px;
        color: #333;
        text-decoration: none;
        border-bottom: 1px solid #eee;
        font-size: 16px;
        font-weight: 500;
        transition: all 0.3s;
      }

      .sidebar-menu a:hover,
      .sidebar-menu a.active {
        background: #f5f5f5;
        color: #667eea;
        padding-left: 20px;
      }

      .main-content {
        flex: 1;
        background: white;
        padding: 40px;
        border-radius: 8px;
      }

      .page-title {
        font-size: 42px;
        font-weight: 700;
        margin-bottom: 40px;
        color: #333;
      }

      .form-group {
        margin-bottom: 30px;
      }

      label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
        color: #333;
        font-size: 14px;
      }

      input[type="text"],
      input[type="email"],
      input[type="phone"] {
        width: 100%;
        padding: 12px 16px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 14px;
      }

      input[type="text"]:focus,
      input[type="email"]:focus,
      input[type="phone"]:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }

      .button-group {
        display: flex;
        gap: 20px;
        margin-top: 40px;
      }

      .btn {
        flex: 1;
        padding: 12px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.3s;
      }

      .btn-primary {
        background: #667eea;
        color: white;
      }

      .btn-primary:hover {
        background: #5568d3;
      }

      .btn-secondary {
        background: #ddd;
        color: #333;
      }

      .btn-secondary:hover {
        background: #ccc;
      }

      .footer {
        background: #1a1a1a;
        color: white;
        padding: 40px;
        text-align: center;
        margin-top: 60px;
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <a href="/" class="navbar-brand">QanTum</a>
      <div class="nav-items">
        <a href="/signin">Sign in/up</a>
        <a href="/dashboard">My Account</a>
      </div>
    </nav>

    <div class="menu-bar">
      <a href="/products">Products</a>
      <a href="/software">Software</a>
      <a href="/support">Support</a>
    </div>

    <div class="container">
      <div class="content-wrapper">
        <aside class="sidebar">
          <div class="sidebar-title">My Account</div>
          <ul class="sidebar-menu">
            <li>
              <a href="/dashboard/account" class="active"
                >Account Information</a
              >
            </li>
            <li><a href="/dashboard/addresses">Address book</a></li>
            <li><a href="/dashboard/orders">My Orders</a></li>
          </ul>
        </aside>

        <main class="main-content">
          <h1 class="page-title">Account Information</h1>

          <form>
            <div class="form-group">
              <label for="username">Username</label>
              <input
                type="text"
                id="username"
                name="username"
                th:value="${user.username}"
                readonly
              />
            </div>

            <div class="form-group">
              <label for="fullname">Full Name</label>
              <input
                type="text"
                id="fullname"
                name="fullname"
                th:value="${user.fullName}"
                readonly
              />
            </div>

            <div class="form-group">
              <label for="email">Email Address</label>
              <input
                type="email"
                id="email"
                name="email"
                th:value="${user.email}"
                readonly
              />
            </div>

            <div class="form-group">
              <label for="joindate">Join Date</label>
              <input
                type="text"
                id="joindate"
                name="joindate"
                value="2026-01-01"
                readonly
              />
            </div>

            <div class="button-group">
              <button
                type="button"
                class="btn btn-primary"
                onclick="enableEditing()"
              >
                Edit Information
              </button>
              <button
                type="button"
                class="btn btn-secondary"
                onclick="window.location.href = '/dashboard'"
              >
                Back
              </button>
            </div>
          </form>
        </main>
      </div>
    </div>

    <footer class="footer">
      <p>
        © 2026 skyaliqo0206. All rights reserved. Logo created by ChatGPT AI.
      </p>
    </footer>

    <script>
      function enableEditing() {
        const inputs = document.querySelectorAll("input[readonly]");
        inputs.forEach((input) => {
          input.removeAttribute("readonly");
          input.style.backgroundColor = "#f9f9f9";
        });
      }
    </script>
  </body>
</html>
