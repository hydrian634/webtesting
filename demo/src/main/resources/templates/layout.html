<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${title} + ' - QanTum'">QanTum</title>
    <link rel="stylesheet" href="/css/style.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background-color: #f5f5f5;
        color: #333;
      }

      .container {
        max-width: 1920px;
        margin: 0 auto;
      }

      /* Navigation */
      .navbar {
        background: #1a1a1a;
        padding: 0 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        height: 98px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      .navbar-brand {
        font-size: 36px;
        font-weight: 700;
        color: #fff;
        text-decoration: none;
      }

      .nav-items {
        display: flex;
        gap: 50px;
        align-items: center;
      }

      .nav-items a {
        color: #fff;
        text-decoration: none;
        font-size: 16px;
        font-weight: 500;
        transition: color 0.3s;
      }

      .nav-items a:hover {
        color: #4caf50;
      }

      /* Main Navigation */
      .menu-bar {
        background: #2a2a2a;
        padding: 0 40px;
        display: flex;
        gap: 80px;
        height: 98px;
        align-items: center;
        border-bottom: 1px solid #444;
      }

      .menu-bar a {
        color: #fff;
        text-decoration: none;
        font-size: 18px;
        font-weight: 500;
        transition: color 0.3s;
      }

      .menu-bar a:hover {
        color: #4caf50;
      }

      /* Footer */
      .footer {
        background: #1a1a1a;
        color: #fff;
        padding: 40px;
        text-align: center;
        margin-top: 60px;
        border-top: 1px solid #444;
      }

      .footer p {
        font-size: 14px;
        margin-bottom: 20px;
      }

      .footer-icons {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 20px;
      }

      .footer-icon {
        width: 81px;
        height: 81px;
        background: #333;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 20px;
      }

      /* Content main */
      .main-content {
        min-height: calc(100vh - 300px);
      }

      /* Alert messages */
      .alert {
        padding: 20px;
        margin: 20px;
        border-radius: 8px;
        display: none;
      }

      .alert.show {
        display: block;
      }

      .alert-success {
        background-color: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }

      .alert-danger {
        background-color: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }
    </style>
  </head>
  <body>
    <!-- Navigation -->
    <nav class="navbar">
      <a href="/" class="navbar-brand">QanTum</a>
      <div class="nav-items">
        <a href="/signin">Sign in/up</a>
        <a href="/">My Account</a>
      </div>
    </nav>

    <!-- Menu Bar -->
    <div class="menu-bar">
      <a href="/products">Products</a>
      <a href="/software">Software</a>
      <a href="/support">Support</a>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <div
        th:if="${message}"
        class="alert alert-success show"
        th:text="${message}"
      ></div>
      <div
        th:if="${error}"
        class="alert alert-danger show"
        th:text="${error}"
      ></div>
      <th:block th:include=":: content"></th:block>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <p>
        © 2026 skyaliqo0206. All rights reserved. Logo created by ChatGPT AI.
      </p>
      <div class="footer-icons">
        <div class="footer-icon">AI</div>
        <div class="footer-icon">ChatGPT</div>
        <div class="footer-icon">Generated</div>
        <div class="footer-icon">2026</div>
      </div>
    </footer>

    <script src="/js/script.js"></script>
  </body>
</html>
